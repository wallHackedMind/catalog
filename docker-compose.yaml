version: "3.8"

services:
  backend:
    build:
      context: ./src
      dockerfile: Dockerfile
    command: uvicorn main:app --reload --host 0.0.0.0
    # command: python3 -m debugpy --listen 0.0.0.0:5678 -m uvicorn main:app --reload --host 0.0.0.0 --port 8000

    ports:
      - 8000:8000

    volumes:
      - ./src:/app
    restart: always
    depends_on:
      - db
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass123
      POSTGRES_DB: catalog
      # HTTP_PROXY: http://user68668:9ny47j@185.113.137.73:1654
    env_file:
      - ./src/.env  
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass123
      POSTGRES_DB: catalog
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
